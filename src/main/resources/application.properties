spring.application.name=AlumnoCRUD

application.title=${APPLICATION_TITLE:Alumnos API Rest Spring Boot} API REST
application.version=${APPLICATION_VERSION:1.0.0}

api.version = ${API_VERSION:v1}
server.port = ${PORT:3000}

# Perfil activo (dev o prod)
spring.profiles.active=dev

# Para los mensajes en las excepciones
server.error.include-message=always

# Para activar los mensajes nivel DEBUG en las clases es.nicolas.alumnos, por ejemplo
logging.level.es.nicolas.alumnos=DEBUG


## JWT
# Configuracion de secreto y tiempo de token en segundos (86400 = 24 horas)
jwt.secret= ContraseñaSegura

# Expiration in seconds
jwt.expiration=9999


## SWAGGER
# Habilitamos Swagger, quitar en produccion porque expone toda la API
springdoc.swagger-ui.enabled=true


## GRAPHQL
# Habilitamos GraphQL
spring.graphql.graphiql.enabled=true
# Path para acceder a GraphiQL UI
spring.graphql.graphiql.path=/graphiql
# Configuramos el endpoint de GraphQL
spring.graphql.http.path=/graphql

## PEBBLE TEMPLATE ENGINE
pebble.suffix=.peb.html
pebble.cache=false
pebble.charset=UTF-8

## Configuracion DevTools
spring.devtools.restart.enabled=true
spring.devtools.restart.exclude=static/**,public/**
spring.devtools.livereload.enabled=true

## Configuracion de i18n (mensajes internacionales)
# Si queremos cambiar el nombre del fichero por defecto (messages.properties) hay que usar esta propiedad
spring.messages.basename=mensajes
spring.messages.encoding=UTF-8
