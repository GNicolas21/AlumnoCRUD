#spring.profiles.active=dev

## Base de datos de desarrollo H2 en memoria
# Podemos elegir en fichero embebido o en memoria.
## La url para ingresar
spring.datasource.url=jdbc:h2:mem:alumnoapirest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
## Usuario y contrase�a (system-administrator)
spring.datasource.username=sa
#spring.datasource.password=

# Habilitamos la consola web de H2 en /h2-console
# En nuesto caso http://localhost:3000/h2-console
spring.h2.console.enabled=true

# Habilitamos los mensajes SQL en el log para ver consultas
# JPA es el estandard de Java para acceso a bases de datos relacionales
# Hibernate es una implementaci�n de JPA
spring.jpa.show-sql=true

# Habilitamos que cargue los datos
# estos datos los carga el archivo data.sql en resources
spring.jpa.defer-datasource-initialization=true

# Habilitamos la creacion de la base de datos en cada arranque,
# y eliminaci�n al parar, util para modo desarrollo.
spring.jpa.hibernate.ddl-auto=create-drop

# Habilitamos la carga de datos en cada arranque
spring.sql.init.mode=always

# Formatea la salida SQL para que se lea mejor en la consola
spring.jpa.properties.hibernate.format_sql=true

# Habilitamos el dialecto de H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Activamos el nivel trace para las sentencias SQL completas (mas detallado)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Para activar los mensajes nivel DEBUG en las clases es.nicolas.alumnos, por ejemplo
logging.level.es.nicolas.AlumnoCrudApplication=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

## Configuración DevTools
spring.devtools.restart.enabled=false
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.restart.exclude=static/**,public/**
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729

## PEBBLE Template Engine
pebble.cache=false
